<ion-split-pane [contentId]="contentId()" when="(min-width: 1027px)">
  <ion-menu [menuId]="menuId()" [contentId]="contentId()" type="overlay" side="start" (ionWillOpen)="onMenuWillOpen()"
    (ionWillClose)="onMenuWillClose()">
    <ion-content [forceOverscroll]="false">
      <app-sidebar [items]="navItems()" [activeId]="activeNavId()" (closed)="closeMenu()"
        (navigated)="onNavigate($event)" (logoutClick)="onLogout()" />
    </ion-content>
  </ion-menu>

  <div class="shell-page" [attr.id]="contentId()">
    <app-header [title]="pageTitle()" [breadcrumb]="breadcrumb()" [profileInitials]="profileInitials()" [profileName]="profileName()"
      [profileRole]="profileRole()" (menuClick)="openMenu()" (settingsClick)="onSettingsFromHeader()"
      (logoutClick)="onLogout()" />

    <main class="shell-page__main">
      <ng-content />
    </main>

    <div class="shell-page__bottom-nav">
      <app-bottom-nav [items]="bottomNavItems()" [activeId]="activeNavId()" (navigated)="onBottomNavNavigate($event)" />
    </div>

    @if (isMenuOpen()) {
    <ion-backdrop class="shell-backdrop" [visible]="true" [tappable]="true"
      (ionBackdropTap)="closeMenu()"></ion-backdrop>
    }
  </div>
</ion-split-pane>
