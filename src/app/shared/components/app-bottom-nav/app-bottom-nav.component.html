<nav class="bottom-nav" [attr.aria-label]="'SHELL.BOTTOM_NAV' | translate">
  @for (item of items(); track item.id) {
    <button
      type="button"
      class="bottom-nav__item"
      [attr.data-nav-id]="item.id"
      [class.bottom-nav__item--active]="isItemActive(item)"
      [attr.aria-current]="isItemActive(item) ? 'page' : null"
      (click)="onNavigate(item)"
    >
      <div class="bottom-nav__icon-box">
        <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
      </div>
      <span class="bottom-nav__label">{{ item.label | translate }}</span>
    </button>
  }
</nav>
