<div class="sidebar" role="navigation" [attr.aria-label]="'SHELL.MAIN_NAV' | translate">
  <button
    type="button"
    class="sidebar__close"
    [attr.aria-label]="'SHELL.CLOSE_MENU' | translate"
    (click)="onClose()"
  >
    <svg
      class="sidebar__close-icon"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M18 6 6 18"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m6 6 12 12"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <div class="sidebar__header">
    <div class="sidebar__brand">
      <ion-avatar class="sidebar__logo" aria-hidden="true">
        <img src="assets/branding/lemonwood-lodge-icon.png" alt="Lemonwood Lodge" class="sidebar__logo-img" />
      </ion-avatar>
      <div class="sidebar__brand-text">
        <ion-label>
          <h2 class="sidebar__brand-name">{{ brandName() }}</h2>
          <div class="sidebar__role-pill sidebar__role-pill--{{ currentRole() }}">
            {{ roleBadgeText() }}
          </div>
        </ion-label>
      </div>
    </div>
  </div>

  <ion-list class="sidebar__nav" lines="none">
    @for (item of items(); track item.id) {
      <ion-item
        class="sidebar__item"
        button
        detail="false"
        [class.sidebar__item--active]="item.id === activeId()"
        [attr.aria-current]="item.id === activeId() ? 'page' : null"
        (click)="onNavigate(item)"
      >
        <ion-icon [name]="item.icon" slot="start" aria-hidden="true"></ion-icon>
        <ion-label class="sidebar__item-label">{{ item.label | translate }}</ion-label>
      </ion-item>
    }
  </ion-list>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__logout-btn" (click)="onLogout()">
      <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'AUTH.LOGOUT' | translate }}</span>
    </button>
  </div>
</div>
