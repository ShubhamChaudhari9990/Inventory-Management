<div class="coming-soon">
  <div class="coming-soon__card">
    <p class="coming-soon__eyebrow">
      @if (sectionLabelKey(); as key) {
        {{ key | translate }}
      } @else {
        {{ sectionId() | titlecase }}
      }
    </p>
    <h2 class="coming-soon__title">{{ 'COMMON.COMING_SOON' | translate }}</h2>
    <p class="coming-soon__text">
      {{ 'COMMON.COMING_SOON_TEXT' | translate }}
    </p>
  </div>
</div>
