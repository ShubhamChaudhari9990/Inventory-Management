<div class="more-page">
  <header class="more-page__header">
    <div class="more-page__header-copy">
      <h1 class="more-page__title">{{ 'NAV.MORE' | translate }}</h1>
      <p class="more-page__subtitle">{{ subtitle() | translate }}</p>
    </div>
  </header>

  <app-dashboard-section-card [title]="''" [noPadding]="true">
    <div class="more-menu">
      @for (item of items(); track item.id) {
        <button
          type="button"
          class="more-menu__item"
          [class.more-menu__item--destructive]="item.destructive"
          (click)="onItemClick(item)"
        >
          <span class="more-menu__icon" [class.more-menu__icon--destructive]="item.destructive">
            <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
          </span>
          <span class="more-menu__label">{{ item.label | translate }}</span>
          @if (!item.destructive) {
            <ion-icon
              class="more-menu__chevron"
              name="chevron-forward-outline"
              aria-hidden="true"
            ></ion-icon>
          }
        </button>
      }
    </div>
  </app-dashboard-section-card>
</div>
