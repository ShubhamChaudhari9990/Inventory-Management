<ion-card class="section-card">
  @if (title()) {
    <ion-card-header class="section-card__header">
      <ion-card-title class="section-card__title">{{ title() }}</ion-card-title>
      <div class="section-card__header-extra">
        <ng-content select="[sectionHeaderExtra]"></ng-content>
      </div>
    </ion-card-header>
  }

  <ion-card-content class="section-card__content" [class.section-card__content--no-padding]="noPadding()">
    <ng-content></ng-content>
  </ion-card-content>
</ion-card>
